[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bookmark-dedupe"
version = "0.1.0"
description = "Find and remove duplicate URLs in a browser bookmarks export"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.scripts]
bookmark-dedupe = "bookmark_dedupe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
